# nginx server blocks for https://defunctcompanies.com (static site, behind Cloudflare proxy)
# Target: nginx 1.24 (Ubuntu 24.04). Install as /etc/nginx/sites-available/defunctcompanies.com
# and symlink into sites-enabled. Also install the snippets:
#   deploy/nginx/defunctcompanies-tls.conf     -> /etc/nginx/snippets/defunctcompanies-tls.conf
#   deploy/nginx/defunctcompanies-headers.conf -> /etc/nginx/snippets/defunctcompanies-headers.conf
#   deploy/nginx/cloudflare-realip.conf        -> /etc/nginx/snippets/defunctcompanies-cloudflare-realip.conf
# The deploy script updates the document root directly, with a full backup.
#
# TLS: pick ONE of the two certificate blocks below (see deploy/README.md):
#   A) Cloudflare Origin CA certificate (recommended with the orange-cloud proxy), or
#   B) Let's Encrypt via certbot.
# Cloudflare SSL/TLS mode must be "Full (strict)".

# --- HTTP: ACME challenges + redirect everything to HTTPS apex -----------------
server {
    listen 80;
    listen [::]:80;
    server_name defunctcompanies.com www.defunctcompanies.com;

    # certbot --webroot (option B) writes challenges here
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://defunctcompanies.com$request_uri;
    }
}

# --- HTTPS www -> apex --------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.defunctcompanies.com;

    include snippets/defunctcompanies-tls.conf;

    return 301 https://defunctcompanies.com$request_uri;
}

# --- HTTPS apex: the site ----------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name defunctcompanies.com;

    include snippets/defunctcompanies-tls.conf;

    root /var/www/defunctcompanies.com;
    include snippets/defunctcompanies-cloudflare-realip.conf;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/defunctcompanies.access.log;
    error_log  /var/log/nginx/defunctcompanies.error.log warn;

    # security headers (same set the apps.smolkin.org site already sends)
    include snippets/defunctcompanies-headers.conf;

    # compression (Cloudflare re-compresses to the visitor, but this cuts origin egress)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/xml application/json
               application/ld+json application/javascript image/svg+xml
               application/manifest+json application/rss+xml;

    # pages: try exact file, then .html, then directory index
    location / {
        try_files $uri $uri.html $uri/ =404;
        # HTML: short browser cache, let Cloudflare/browsers revalidate after deploys
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        include snippets/defunctcompanies-headers.conf;
    }

    # static assets: not fingerprinted, so a week rather than "immutable"
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        include snippets/defunctcompanies-headers.conf;
        access_log off;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        include snippets/defunctcompanies-headers.conf;
    }
    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        include snippets/defunctcompanies-headers.conf;
    }
    location = /assets/site.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # never serve dotfiles / macOS metadata if one slips into a deploy
    location ~ /\. { deny all; return 404; }

    error_page 404 /404.html;
    location = /404.html { internal; }
}

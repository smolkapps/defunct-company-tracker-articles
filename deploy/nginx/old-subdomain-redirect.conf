# 301 the old app subdomain to the new domain, path-preserving.
# Every page keeps the same path on the new site (/companies/<slug>.html,
# /methodology.html, /sitemap.xml, ...), so $request_uri maps 1:1.
#
# Apply by REPLACING the body (root / location blocks) of the existing
# server block for defunct-company-tracker-articles.apps.smolkin.org with the
# lines marked "redirect". Keep that block's existing listen/ssl_certificate
# lines exactly as they are (the certificate for apps.smolkin.org stays valid).
# Find it with:  sudo grep -rl "defunct-company-tracker-articles" /etc/nginx/
#
# Full example (adjust the certificate paths to whatever the current file uses):

server {
    listen 80;
    listen [::]:80;
    server_name defunct-company-tracker-articles.apps.smolkin.org;

    # keep certbot renewals for the old cert working
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / { return 301 https://defunctcompanies.com$request_uri; }   # redirect
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name defunct-company-tracker-articles.apps.smolkin.org;

    # EXISTING certificate lines -- keep whatever the current config has, e.g.:
    # ssl_certificate     /etc/letsencrypt/live/defunct-company-tracker-articles.apps.smolkin.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/defunct-company-tracker-articles.apps.smolkin.org/privkey.pem;

    # The old site served index at "/" and "/index.html"; both go to the new root.
    location = /index.html { return 301 https://defunctcompanies.com/; }  # redirect
    location / { return 301 https://defunctcompanies.com$request_uri; }    # redirect
}

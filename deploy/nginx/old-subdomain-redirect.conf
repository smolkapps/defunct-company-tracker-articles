# 301 the old app subdomain to the new domain, path-preserving.
# Every page keeps the same path on the new site (/companies/<slug>.html,
# /methodology.html, /status/<status>.html, /collections/<name>.html,
# /sitemap.xml, ...), so $request_uri maps 1:1.
#
# On the Hetzner nginx host (167.233.238.194), *.apps.smolkin.org is served by a
# regex server_name in /etc/nginx/sites-enabled/apps.smolkin.org using the
# wildcard certificate /etc/letsencrypt/live/apps-smolkin/{fullchain,privkey}.pem.
# Installing this exact-match server_name vhost into
# /etc/nginx/sites-available/defunct-company-tracker-articles.apps.smolkin.org
# and symlinking it into /etc/nginx/sites-enabled/ takes precedence over the
# regex vhost without modifying apps.smolkin.org.

server {
    listen 80;
    listen [::]:80;
    server_name defunct-company-tracker-articles.apps.smolkin.org;

    # keep certbot HTTP-01 challenges working if ever needed
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://defunctcompanies.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name defunct-company-tracker-articles.apps.smolkin.org;

    ssl_certificate     /etc/letsencrypt/live/apps-smolkin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apps-smolkin/privkey.pem;

    location / {
        return 301 https://defunctcompanies.com$request_uri;
    }
}

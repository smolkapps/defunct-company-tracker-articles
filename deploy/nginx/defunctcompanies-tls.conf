# /etc/nginx/snippets/defunctcompanies-tls.conf
# Keep exactly ONE of the two certificate pairs uncommented.

# --- Option A: Cloudflare Origin CA certificate (valid only behind the CF proxy) ---
ssl_certificate     /etc/ssl/cloudflare/defunctcompanies.com.pem;
ssl_certificate_key /etc/ssl/cloudflare/defunctcompanies.com.key;

# --- Option B: Let's Encrypt (certbot) ---
# ssl_certificate     /etc/letsencrypt/live/defunctcompanies.com/fullchain.pem;
# ssl_certificate_key /etc/letsencrypt/live/defunctcompanies.com/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:defunctcompanies_ssl:10m;
ssl_session_timeout 1d;

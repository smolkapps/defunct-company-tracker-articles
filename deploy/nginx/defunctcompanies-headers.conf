# /etc/nginx/snippets/defunctcompanies-headers.conf
# Included in every location because nginx drops server-level add_header
# directives inside any location that sets its own add_header.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Start with a short HSTS; raise to 31536000 once HTTPS is confirmed stable.
add_header Strict-Transport-Security "max-age=86400" always;

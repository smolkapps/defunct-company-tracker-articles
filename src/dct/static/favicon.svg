<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Defunct company headstone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3040"/>
      <stop offset="1" stop-color="#171a24"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9ecf3"/>
      <stop offset="1" stop-color="#b9bfce"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a5f3a"/>
      <stop offset="1" stop-color="#2b4a2b"/>
    </linearGradient>
  </defs>

  <!-- rounded background -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- ground mound -->
  <path d="M56 430 Q256 372 456 430 L456 470 Q256 452 56 470 Z" fill="url(#grass)"/>

  <!-- headstone: rounded-top slab -->
  <path d="M168 430 L168 232 Q168 128 256 128 Q344 128 344 232 L344 430 Z"
        fill="url(#stone)" stroke="#8a90a0" stroke-width="6"/>

  <!-- inner bevel line -->
  <path d="M196 418 L196 236 Q196 158 256 158 Q316 158 316 236 L316 418"
        fill="none" stroke="#c7ccd8" stroke-width="4" opacity="0.8"/>

  <!-- RIP engraving -->
  <text x="256" y="262" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="700"
        fill="#3d4354" letter-spacing="6">RIP</text>

  <!-- horizontal rule under RIP -->
  <rect x="206" y="292" width="100" height="7" rx="3" fill="#3d4354" opacity="0.75"/>

  <!-- date-ish dashes suggesting "founded — closed" -->
  <rect x="212" y="330" width="34" height="10" rx="5" fill="#5b6274"/>
  <rect x="252" y="330" width="16" height="10" rx="5" fill="#5b6274"/>
  <rect x="274" y="330" width="34" height="10" rx="5" fill="#5b6274"/>

  <!-- small cross finial hint at top -->
  <rect x="248" y="150" width="16" height="44" rx="4" fill="#9aa0b0" opacity="0.0"/>
</svg>
